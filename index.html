<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TLC Factory Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: thanh trên cố định (logo, giờ, kết nối, thông báo) · sidebar module · vùng nội dung có thanh lọc kỳ/phạm vi */
:root{
  --navy:#20409A; --cyan:#00B2EB;
  --bg:#F4F6FB; --surface:#FFFFFF; --sunk:#EAEEF7; --line:#D5DCEB;
  --fg:#16213D; --muted:#5A6684; --accent:#20409A; --accent-2:#0089B8; --plan:#E08A00;
  --ok:#1E8E4F; --ok-bg:#E3F4EA; --warn:#B07A00; --warn-bg:#FFF4D6; --bad:#C62E2E; --bad-bg:#FBE5E5; --none:#7A8399; --none-bg:#ECEEF3;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Barlow Condensed","Be Vietnam Pro",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1426; --surface:#161E36; --sunk:#1C2642; --line:#2A3658; --fg:#E6EBF7; --muted:#9AA6C4; --accent:#7EA0FF; --accent-2:#3CC8F5; --plan:#FFB547;
  --ok:#4CC97F; --ok-bg:#163A28; --warn:#F2C14E; --warn-bg:#3A3015; --bad:#FF7272; --bad-bg:#40191D; --none:#8C95AD; --none-bg:#232B44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1426; --surface:#161E36; --sunk:#1C2642; --line:#2A3658; --fg:#E6EBF7; --muted:#9AA6C4; --accent:#7EA0FF; --accent-2:#3CC8F5; --plan:#FFB547;
  --ok:#4CC97F; --ok-bg:#163A28; --warn:#F2C14E; --warn-bg:#3A3015; --bad:#FF7272; --bad-bg:#40191D; --none:#8C95AD; --none-bg:#232B44; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo-chip{background:#fff;border-radius:6px;padding:3px 7px;display:flex}
.logo-chip img{height:24px;display:block}
.brand{font-family:var(--f-disp);font-size:20px;letter-spacing:.05em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:0;opacity:.8;margin-top:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-num);font-size:12.5px;opacity:.9}
.conn{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:#FFF4D6;color:#8A5E00;white-space:nowrap}
.conn.live{background:#E3F4EA;color:#1E6E3F}
.user{font-size:12.5px;text-align:right;line-height:1.2}
.user small{display:block;opacity:.75;font-size:11px}
.bell{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:36px;height:34px;cursor:pointer;display:grid;place-items:center}
.bell svg{width:18px;height:18px}
.bell .n{position:absolute;top:-6px;right:-6px;background:#E5484D;color:#fff;font:700 10.5px var(--f-num);border-radius:99px;padding:1px 5px}
.notif{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:100%;margin-top:6px;width:min(380px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,50,.25);padding:6px}
.notif h4{margin:6px 8px 8px;font-size:13px}
/* layout */
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 52px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:1px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:10px 10px 4px;font-weight:700}
.side button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:6px;color:var(--fg)}
.side button:hover{background:var(--sunk)}
.side button[aria-current="true"]{background:var(--navy);color:#fff}
.side button .ph{font-size:10.5px;color:var(--muted)}
.side button[aria-current="true"] .ph{color:#cfd8f5}
main{padding:16px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
/* filter bar */
.fbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.datebox{display:flex;align-items:center;gap:4px}
.datebox button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;width:30px;height:32px;cursor:pointer;font-size:15px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.flabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.period{font-weight:600;font-size:13.5px}
.period small{color:var(--muted);font-weight:500}
/* KPI */
h2.sec{font-size:14px;margin:18px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2.sec small{font-weight:500;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px 10px;border-top:4px solid var(--none);display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.kpi .scope .pill{margin-top:3px}
.kpi:hover{border-color:var(--accent)}
.kpi.ok{border-top-color:var(--ok)} .kpi.warn{border-top-color:var(--warn)} .kpi.bad{border-top-color:var(--bad)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}
.kpi .val{font-family:var(--f-num);font-size:23px;font-weight:600;margin:4px 0 3px;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.kpi .val small{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .row{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--f-num)}
.kpi .scope{font-size:10.5px;color:var(--muted);margin-top:4px;font-family:var(--f-body)}
.up{color:var(--ok)} .dn{color:var(--bad)} .flat{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-none{background:var(--none-bg);color:var(--none)} .p-acc{background:var(--sunk);color:var(--accent)}
.groups{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gchip{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-size:12.5px;font-weight:600}
.gchip:hover{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.card h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:500;color:var(--muted)}
.card svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:4px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend b.ln{height:3px;vertical-align:2px;width:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px}
.alerts{display:grid;gap:6px}
.alert{display:grid;grid-template-columns:6px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.alert .sv{background:var(--warn)} .alert.bad .sv{background:var(--bad)}
.alert .b{padding:8px 12px;min-width:0}
.alert .t{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.alert .t span.k{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.alert .d{font-size:12px;color:var(--muted)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px;text-align:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:11.5px;color:var(--muted);white-space:nowrap}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--accent)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--f-num);font-size:12px;white-space:nowrap}
.src{font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--accent-2);margin-left:4px;vertical-align:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tools input,.tools select{font-size:12.5px}
.small{font-size:12px;color:var(--muted)}
/* drawer */
.ovl{position:fixed;inset:0;background:rgba(10,18,40,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.drawer h2{margin:0;font-family:var(--f-disp);font-size:26px;color:var(--accent);letter-spacing:.02em}
.x{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:12px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;border-left:4px solid var(--none)}
.m.ok{border-left-color:var(--ok)} .m.warn{border-left-color:var(--warn)} .m.bad{border-left-color:var(--bad)}
.m .l{font-size:11.5px;color:var(--muted);font-weight:600}
.m .v{font-family:var(--f-num);font-size:17px;font-weight:600}
.m .v small{font-size:11px;color:var(--muted);font-weight:500}
.btn{font:600 13px var(--f-body);padding:8px 14px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
input.err,select.err{border-color:var(--bad);background:var(--bad-bg)}
.msg{font-size:12px;font-weight:600} .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
.ph-card{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:60}
.fld{display:grid;gap:4px} .fld label{font-size:12px;font-weight:600;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(160deg,var(--navy) 0 38%,var(--bg) 38%)}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(400px,100%);box-shadow:0 18px 40px rgba(16,32,80,.18)}
.lcard form{display:grid;gap:12px}
.lhead{display:flex;gap:12px;align-items:center;margin-bottom:16px}.lhead .logo-chip{border:1px solid var(--line)}
.ldemo{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;padding-left:max(8px,env(safe-area-inset-left,0px))}
  .side .grp{display:none}
  .side button{flex:none;white-space:nowrap}
  .side button .ph{display:none}
  .user,.clock,.brand small{display:none}
  .topbar{position:static}
  .brand{font-size:16px}
  .fbar{position:static}
  main{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function range(period,date){
  if(period==="day")return[date,date];
  if(period==="week"){const w=(D0(date).getUTCDay()+6)%7;const a=addDays(date,-w);return[a,addDays(a,6)]}
  const a=date.slice(0,8)+"01";const n=new Date(Date.UTC(+date.slice(0,4),+date.slice(5,7),0)).getUTCDate();return[a,date.slice(0,8)+String(n).padStart(2,"0")];
}
function prevDate(period,date){
  if(period==="day"){let d=addDays(date,-1);for(let k=0;k<10&&!DB.days.includes(d);k++)d=addDays(d,-1);return d}
  if(period==="week")return addDays(range("week",date)[0],-1);
  return addDays(range("month",date)[0],-1);
}
function stepDate(dir){
  if(ST.period==="day"){let d=addDays(ST.date,dir);for(let k=0;k<10&&!DB.days.includes(d)&&d>=DATA_FROM&&d<=DATA_TO;k++)d=addDays(d,dir);return d}
  if(ST.period==="week")return addDays(ST.date,7*dir);
  const y=+ST.date.slice(0,4),m=+ST.date.slice(5,7)-1+dir;const d=new Date(Date.UTC(y,m,1));return isoOf(d);
}

  if(ST.period==="day")return `${dowVN(a)} ${dmy(a)}`;
  if(ST.period==="week")return `Tuần ${dm(a)} – ${dm(b)}/${b.slice(0,4)}`;
  return `Tháng ${a.slice(5,7)}/${a.slice(0,4)}`;
}

/* ============================================================
   TỔNG HỢP SỐ LIỆU THEO KỲ + PHẠM VI
   ============================================================ */
function agg(a,b,scope){
  const days=DB.days.filter(d=>d>=a&&d<=b);
  const rows=DB.prod.filter(r=>r.d>=a&&r.d<=b&&(scope==="all"||r.line===+scope));
  const end=days.length?days[days.length-1]:null;
  const F=days.map(d=>DB.fac[d]);
  const has=rows.length>0;
  const plan=sum(rows.map(r=>r.plan)),act=sum(rows.map(r=>r.act)),ng=sum(rows.map(r=>r.ng)),rw=sum(rows.map(r=>r.rw));
  const insp=sum(rows.map(r=>r.qcInsp)),qcNg=sum(rows.map(r=>r.qcNg));
  const mh=sum(rows.map(r=>r.hc*(r.hours+r.ot))),otH=sum(rows.map(r=>r.hc*r.ot));
  const dtCD=sum(rows.map(r=>r.dtCD)),dtSX=sum(rows.map(r=>r.dtSX)),stops=rows.filter(r=>r.dtCD>0).length;
  const lostMh=sum(rows.map(r=>r.dtCD/60*r.hc));
  const defT=[0,0,0,0,0,0];rows.forEach(r=>r.def.forEach((v,j)=>defT[j]+=v));
  const byCode={};rows.forEach(r=>{byCode[r.code]=byCode[r.code]||{act:0,ng:0};byCode[r.code].act+=r.act+r.ng;byCode[r.code].ng+=r.qcNg});
  const stage={};DEFECTS.forEach(([n,s],j)=>stage[s]=(stage[s]||0)+defT[j]);
  const ngOp=sum(DEFECTS.map((x,j)=>x[2]==="op"?defT[j]:0)),ngSup=qcNg-ngOp;
  rows.forEach(r=>{const op=sum(DEFECTS.map((x,j)=>x[2]==="op"?r.def[j]:0));byCode[r.code].op=(byCode[r.code].op||0)+op;byCode[r.code].sup=(byCode[r.code].sup||0)+(r.qcNg-op)});
  const prodRate=mh?act/mh:null;
  const stdH=sum(rows.map(r=>r.act/(r.norm||normOf(r.code)))); // giờ chuẩn đạt được theo định mức từng mã
  // đơn hàng (tính tại cuối kỳ)
  const O=DB.orders, ref=b>DATA_TO?DATA_TO:b;
  const ordState=o=>o.comp<=ref?"done":o.due<ref?"over":(o.start>ref?"wait":(diffDays(ref,o.due)<=3&&o.risk?"risk":"prod"));
  const inPeriodDone=O.filter(o=>o.comp>=a&&o.comp<=b&&o.comp<=DATA_TO);
  const otd=inPeriodDone.length?inPeriodDone.filter(o=>o.comp<=o.due).length/inPeriodDone.length*100:null;
  const ordCount={prod:0,risk:0,over:0,wait:0,done:0};O.forEach(o=>{const s=ordState(o);if(s==="done"){if(o.comp>=a)ordCount.done++}else ordCount[s]++});
  const dueIn=O.filter(o=>o.due>=a&&o.due<=b).length;
  // nhiệm vụ tại cuối kỳ
  const taskState=t=>t.created>ref?null:(t.done&&t.done<=ref?"done":t.due<ref?"over":"doing");
  const tByDept={};DEPTS.forEach(dp=>tByDept[dp]={done:0,doing:0,over:0});
  DB.tasks.forEach(t=>{const s=taskState(t);if(!s)return;if(s==="done"&&t.done<a)return;tByDept[t.dept][s]++});
  // bảo hành
  const W=DB.war.filter(w=>w.d<=ref);
  const wNew=W.filter(w=>w.d>=a);
  const wOpen=W.filter(w=>!w.closed||w.closed>ref);
  const wOver=wOpen.filter(w=>diffDays(w.d,ref)>7);
  const wClosedIn=W.filter(w=>w.closed&&w.closed>=a&&w.closed<=ref);
  const wAvg=wClosedIn.length?sum(wClosedIn.map(w=>diffDays(w.d,w.closed)))/wClosedIn.length:null;
  const wFam={},wDef={};wNew.forEach(w=>{wFam[w.fam]=(wFam[w.fam]||0)+w.qty;wDef[w.def]=(wDef[w.def]||0)+1});
  // nhân sự
  const present=F.length?sum(F.map(f=>f.staffTotal-f.absent))/F.length:null;
  const absent=F.length?sum(F.map(f=>f.absent))/F.length:null;
  const hcLine=days.length?sum(rows.map(r=>r.hc))/days.length:null;
  const demand=scope==="all"?(F.length?sum(F.map(f=>f.demand))/F.length:null):(days.length?8.2:null);
  const hcAvg=days.length?sum(rows.map(r=>r.hc))/days.length:null;
  const fe=end?DB.fac[end]:null;
  const WS=DB.wsales.filter(w=>w.d>=a&&w.d<=b);const wsF={};WS.forEach(w=>{wsF[w.fam]=wsF[w.fam]||{sold:0,wq:0};wsF[w.fam].sold+=w.sold;wsF[w.fam].wq+=w.wq});
  const wSold=sum(WS.map(w=>w.sold)),wWq=sum(WS.map(w=>w.wq));
  return{days,end,has,rows,plan,act,ng,rw,insp,qcNg,ngOp,ngSup,opRate:insp?ngOp/insp*100:null,supRate:insp?ngSup/insp*100:null,mh,otH,dtCD,dtSX,stops,lostMh,defT,byCode,stage,prodRate,
    pctPlan:plan?act/plan*100:null,defRate:insp?qcNg/insp*100:null,fpy:insp?(insp-qcNg-rw)/insp*100:null,rwRate:insp?rw/insp*100:null,
    prodPct:mh?stdH/mh*100:null,stdH,
    wSold,wWq,wRate:wSold?wWq/wSold*100:null,wsF,
    otd,ordCount,dueIn,tByDept,wNew,wOpen,wOver,wAvg,wFam,wDef,wQty:sum(wNew.map(w=>w.qty)),
    present,absent,hcLine,demand,hcAvg,cover:hcAvg&&demand?hcAvg/demand*100:null,training:fe?fe.training:null,
    invValue:fe?fe.invValue:null,shortage:fe?fe.shortage:null,belowMin:fe?fe.belowMin:null,invAcc:fe?fe.invAcc:null,ngPending:fe?fe.ngPending:null,
    supply:fe?(1-fe.shortage/60)*100:null,
    cogs:F.length?sum(F.map(f=>f.cogs))/F.length:null,unitPlan:F.length?52000:null,unitAct:F.length?Math.round(sum(F.map(f=>f.unitAct))/F.length):null,
    laborCost:F.length?sum(F.map(f=>f.laborCost)):null,defCost:qcNg?qcNg*52000/1e6:(F.length?0:null),matVar:F.length?sum(F.map(f=>f.matVar))/F.length:null,
    pm:F.length?sum(F.map(f=>f.pmDone))/sum(F.map(f=>f.pmPlan))*100:null,eqDown:fe?fe.eqDown+(rows.some(r=>r.d===end&&r.dtCD>60)?1:0):null,eqRisk:fe?fe.eqRisk:null,
    mttr:stops?dtCD/stops:null,mtbf:stops?(sum(rows.map(r=>r.hours))/stops):null
  };
}

/* ---------------- trạng thái màu ---------------- */
function judge(key,val,dir,mult=1){
  if(val==null||!isFinite(val))return{s:"none",p:null};
  const t=CFG.th[key];const tgt=t.tgt*mult;
  const p=dir>0?val/tgt*100:(val<=0?100:tgt/val*100);
  return{s:p>=t.g?"ok":p>=t.y?"warn":"bad",p};
}
const SLBL={ok:"Đạt",warn:"Nguy cơ",bad:"Không đạt",none:"Chưa có dữ liệu"};

/* ============================================================
   CẢNH BÁO TỰ SINH (theo quy tắc + ngưỡng cấu hình)
   ============================================================ */
function buildAlerts(A){
  const L=[];if(!A.days.length)return L;
  const end=A.end, lines=CFG.lines;
  // 1 thiếu NVL
  if(A.shortage>0){const s=DB.shortList.slice(0,Math.min(A.shortage,DB.shortList.length));L.push({sev:"bad",grp:"Thiếu NVL",t:`${A.shortage} mã linh kiện thiếu cho lệnh SX`,d:s.map(x=>`${x[0]} (thiếu ${fmt(x[1])}, cần ${dm(x[2])})`).join("; ")+" · TKLK + KHSX"})}
  // 2 đơn nguy cơ trễ / quá hạn
  if(A.ordCount.over)L.push({sev:"bad",grp:"Đơn hàng",t:`${A.ordCount.over} đơn quá hạn giao`,d:"Xem nhóm Tiến độ đơn hàng · KHSX"});
  if(A.ordCount.risk)L.push({sev:"warn",grp:"Đơn hàng",t:`${A.ordCount.risk} đơn có nguy cơ trễ (≤ 3 ngày đến hạn)`,d:"KHSX đề xuất phương án tăng ca/đổi line"});
  // 3 tỷ lệ lỗi, tách NG thao tác (Sản xuất) và NG nhà cung cấp (QAC/Mua hàng)
  const perLine=src=>lines.map((n,i)=>{const r=A.rows.filter(x=>x.line===i);const ins=sum(r.map(x=>x.qcInsp)),q=sum(r.map(x=>sum(DEFECTS.map((t,j)=>t[2]===src?x.def[j]:0))));return[n,ins?q/ins*100:0]});
  if(A.opRate!=null&&A.opRate>CFG.th.defOp.tgt){
    const per=perLine("op").filter(x=>x[1]>CFG.th.defOp.tgt).sort((x,y)=>y[1]-x[1]);
    const top=DEFECTS.map((t,j)=>[t[0],A.defT[j],t[2]]).filter(x=>x[2]==="op").sort((x,y)=>y[1]-x[1])[0];
    L.push({sev:judge("defOp",A.opRate,-1).s==="bad"?"bad":"warn",grp:"NG thao tác",t:`NG thao tác ${fmt(A.opRate,2)}% vượt ngưỡng ${fmt(CFG.th.defOp.tgt,2)}%`,d:(per.length?`${per.slice(0,3).map(x=>x[0]+" "+fmt(x[1],2)+"%").join(", ")}. `:"")+`Nhiều nhất: ${top[0]} (${fmt(top[1])} sp) · Trưởng SX + KT sản xuất`});
  }
  if(A.supRate!=null&&A.supRate>CFG.th.defSup.tgt){
    const comp=DEFECTS.map((t,j)=>[t[3],A.defT[j],t[2]]).filter(x=>x[2]==="sup").sort((x,y)=>y[1]-x[1]);
    L.push({sev:judge("defSup",A.supRate,-1).s==="bad"?"bad":"warn",grp:"NG NCC",t:`NG nhà cung cấp ${fmt(A.supRate,2)}% vượt ngưỡng ${fmt(CFG.th.defSup.tgt,2)}%`,d:comp.map(x=>`${x[0]} ${fmt(x[1])} sp`).join("; ")+" · QAC siết IQC lô kế tiếp, Mua hàng lập claim NCC"});
  }
  // 4 dừng máy & lệch CĐ/SX (ngày cuối kỳ)
  const endRows=A.rows.filter(r=>r.d===end);
  endRows.filter(r=>r.dtCD>CFG.th.dt.tgt).forEach(r=>L.push({sev:"bad",grp:"Thiết bị",t:`${lines[r.line]} dừng máy ${r.dtCD} phút (${dm(end)})`,d:"Vượt ngưỡng "+CFG.th.dt.tgt+" phút · Cơ điện"}));
  const dtMis=A.rows.filter(r=>Math.abs(r.dtCD-r.dtSX)>CFG.dtDiffMin);
  if(dtMis.length)L.push({sev:"warn",grp:"Đối chiếu",t:`Lệch giờ dừng máy CĐ ↔ SX: ${dtMis.length} lượt`,d:dtMis.slice(-3).map(r=>`${lines[r.line]} ${dm(r.d)}: CĐ ${r.dtCD}′, SX ${r.dtSX}′`).join("; ")});
  // 5 lệch NG QAC ↔ SX
  const ngMis=[];lines.forEach((n,i)=>{const r=A.rows.filter(x=>x.line===i);const q=sum(r.map(x=>x.qcNg)),s=sum(r.map(x=>x.ng));const df=Math.abs(q-s);if(df>CFG.ngDiffQty&&df/Math.max(1,s)*100>CFG.ngDiffPct)ngMis.push(`${n}: QAC ${q}, SX ${s}`)});
  if(ngMis.length)L.push({sev:"warn",grp:"Đối chiếu",t:`Lệch số NG giữa QAC và SX: ${ngMis.length} line`,d:ngMis.slice(0,3).join("; ")+" · QAC + Trưởng SX"});
  // 6 nhiệm vụ quá hạn
  const over=sum(Object.values(A.tByDept).map(x=>x.over));
  if(over){const top=Object.entries(A.tByDept).filter(x=>x[1].over).sort((x,y)=>y[1].over-x[1].over).slice(0,3);L.push({sev:"bad",grp:"Nhiệm vụ",t:`${over} nhiệm vụ quá hạn`,d:top.map(x=>`${x[0]} ${x[1].over}`).join(", ")})}
  // 7 báo cáo chưa nộp (ngày cuối kỳ)
  const rp=DB.reports[end]||{};const miss=POSITIONS.filter(p=>!rp[p[0]]).map(p=>p[0]),late=POSITIONS.filter(p=>rp[p[0]]&&rp[p[0]]>CFG.cutoff).map(p=>p[0]+" "+rp[p[0]]);
  if(miss.length||late.length)L.push({sev:"bad",grp:"Báo cáo",t:`Báo cáo ngày ${dm(end)}: ${miss.length} chưa nộp, ${late.length} nộp muộn`,d:[miss.length?"Chưa nộp: "+miss.join(", "):"",late.length?"Muộn: "+late.join(", "):""].filter(Boolean).join(" · ")});
  // 8 sự cố chưa có người xử lý
  const noOwner=DB.issues.filter(i=>i.open<=A.end&&(!i.closed||i.closed>A.end)&&!i.owner);
  if(noOwner.length)L.push({sev:"bad",grp:"Vấn đề",t:`${noOwner.length} vấn đề chưa có người xử lý`,d:noOwner.map(i=>i.id+" "+i.title).join("; ")});
  // 9 tỷ lệ lỗi bảo hành theo nhóm SP
  const wOverF=Object.entries(A.wsF).map(([f,o])=>[f,o.sold?o.wq/o.sold*100:0,o.wq,o.sold]).filter(x=>x[1]>CFG.th.warRate.tgt).sort((x,y)=>y[1]-x[1]);
  if(wOverF.length)L.push({sev:judge("warRate",wOverF[0][1],-1).s==="bad"?"bad":"warn",grp:"Bảo hành",t:`Tỷ lệ lỗi bảo hành vượt ${fmt(CFG.th.warRate.tgt,2)}%: ${wOverF.length} nhóm sản phẩm`,d:wOverF.slice(0,3).map(x=>`${x[0]} ${fmt(x[1],2)}% (${fmt(x[2])}/${fmt(x[3])})`).join("; ")+" · Kỹ thuật SP + QAC phân tích nguyên nhân"});
  // 10 tồn kho
  if(A.invValue!=null&&A.invValue>CFG.th.inv.tgt)L.push({sev:"warn",grp:"Kho",t:`Giá trị tồn ${fmt(A.invValue,1)} tỷ vượt mức tối đa ${fmt(CFG.th.inv.tgt,1)} tỷ`,d:`${A.belowMin} mã dưới MIN; ${fmt(A.ngPending)} hàng lỗi chờ xử lý`});
  const rank={bad:0,warn:1};return L.sort((x,y)=>rank[x.sev]-rank[y.sev]);
}

/* ============================================================
   BIỂU ĐỒ SVG
   ============================================================ */
function combo(labels,bars,line,opts){
  const W=380,H=190,L=44,R=10,T=14,B=26,iw=W-L-R,ih=H-T-B,n=labels.length;
  const vals=bars.concat(line||[]).filter(v=>v!=null);
  if(!n||!vals.length)return `<div class="empty">Chưa có dữ liệu cho kỳ này</div>`;
  if(opts.ref!=null)vals.push(opts.ref);
  let mx=opts.max!=null?opts.max:Math.max(...vals)*1.12,mn=opts.min!=null?opts.min:0;if(mx<=mn)mx=mn+1;
  const y=v=>T+ih-(Math.max(mn,Math.min(mx,v))-mn)/(mx-mn)*ih,bw=iw/n,x=i=>L+bw*i+bw/2;
  let g="";
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-5}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${opts.tick(v)}</text>`}
  const every=Math.ceil(n/12);
  labels.forEach((l,i)=>{if((n-1-i)%every===0)g+=`<text x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(l)}</text>`});
  const hl=opts.hl;
  const stk=opts.stack;
  if(stk)stk.forEach((v,i)=>{if(v!=null)vals.push(v+(bars[i]||0))});
  bars.forEach((v,i)=>{if(v==null)return;const w=Math.max(2,bw*0.62);if(stk&&stk[i]!=null){const top=v+stk[i];g+=`<rect x="${(x(i)-w/2).toFixed(1)}" y="${y(top).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,y(v)-y(top)).toFixed(1)}" rx="2" fill="${opts.stackColor}"><title>${esc(labels[i])}: ${opts.stackTip(stk[i])}</title></rect>`}g+=`<rect x="${(x(i)-w/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(mn)-y(v)).toFixed(1)}" rx="2" fill="${opts.color(v,i)}" opacity="${hl!=null&&hl!==i?0.35:1}"><title>${esc(labels[i])}: ${opts.tip(v)}</title></rect>`});
  if(line){const pts=line.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
    if(opts.lineArea)g+=`<polygon points="${x(0).toFixed(1)},${y(mn).toFixed(1)} ${pts.join(" ")} ${x(n-1).toFixed(1)},${y(mn).toFixed(1)}" fill="${opts.lineColor}" opacity=".12"/>`;
    g+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${opts.lineColor}" stroke-width="2" ${opts.lineDash?'stroke-dasharray="5 3"':""}/>`;
    line.forEach((v,i)=>{if(v!=null&&(n<=16||i===n-1))g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===n-1?3.5:2.2}" fill="${opts.lineColor}"><title>${esc(labels[i])}: ${opts.tip(v)}</title></circle>`});}
  if(opts.ref!=null)g+=`<line x1="${L}" x2="${W-R}" y1="${y(opts.ref).toFixed(1)}" y2="${y(opts.ref).toFixed(1)}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W-R}" y="${(y(opts.ref)-4).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--bad)" font-weight="600">${esc(opts.refLabel)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria)}">${g}</svg>`;
}
function hbars(rows,colors,aria){
  const W=380,rowH=24,L=124,R=34,H=rows.length*rowH+6,mx=Math.max(1,...rows.map(r=>sum(r[1])));
  let g="";rows.forEach((r,i)=>{let xx=L;const yy=4+i*rowH;
    g+=`<text x="${L-6}" y="${yy+14}" text-anchor="end" font-size="10.5" fill="var(--fg)">${esc(r[0])}</text>`;
    r[1].forEach((v,j)=>{const w=v/mx*(W-L-R);if(w>0)g+=`<rect x="${xx.toFixed(1)}" y="${yy+4}" width="${Math.max(w-1,1).toFixed(1)}" height="14" fill="${colors[j]}" rx="1"><title>${esc(r[0])}: ${v}</title></rect>`;xx+=w});
    g+=`<text x="${(xx+4).toFixed(1)}" y="${yy+14}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${sum(r[1])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg>`;
}

/* ============================================================
   MÀN HÌNH TỔNG QUAN NHÀ MÁY

let A=null,AP=null,ALERTS=[];
function compute(){
  const[a,b]=range(ST.period,ST.date);A=agg(a,b,ST.scope);
  const pd=prevDate(ST.period,ST.date);const[pa,pb]=range(ST.period,pd);AP=agg(pa,pb,ST.scope);

function card(key,label,val,unit,dec,tgt,tgtTxt,jd,prev,dir,scopeNote,grp){

   <div class="lbl"><span>${label}</span><span class="pill p-${jd.s}">${SLBL[jd.s]}</span></div>

   <div class="row"><span class="${good==null?"flat":good?"up":"dn"}">${tr==null?"Kỳ trước —":"Kỳ trước "+arrow+" "+fmt(Math.abs(tr),dec)}</span><span>${jd.p==null?"":fmt(jd.p,0)+"%"}</span></div>
   ${scopeNote?`<div class="scope">${scopeNote}</div>`:""}</button>`;
}
function kpiHTML(){

  const dtLimit=CFG.th.dt.tgt*(nd||1)*(line?0.1:1);
  return `<div class="kpis">

const GROUPS=[["sx","Sản xuất"],["cl","Chất lượng"],["dh","Tiến độ đơn hàng"],["kho","Kho & cung ứng"],["cp","Chi phí"],["tb","Thiết bị & bảo trì"],["ns","Nhân sự"],["bh","Bảo hành & khách hàng"]];
function groupStatus(g){
  const w=s=>({bad:3,warn:2,ok:1,none:0})[s];const pick=arr=>arr.reduce((m,s)=>w(s)>w(m)?s:m,"none");
  const nd=A.days.length||1,line=ST.scope!=="all";
  switch(g){
    case"sx":return pick([judge("out",A.pctPlan,1).s,judge("prod",A.prodPct,1).s]);
    case"cl":return pick([judge("def",A.defRate,-1).s,judge("defOp",A.opRate,-1).s,judge("defSup",A.supRate,-1).s,judge("fpy",A.fpy,1).s]);
    case"dh":return pick([judge("otd",A.otd,1).s,A.ordCount.over?"bad":A.ordCount.risk?"warn":"ok"]);
    case"kho":return pick([judge("inv",A.invValue,-1).s,A.shortage?"bad":"ok"]);
    case"cp":return judge("cogs",A.cogs,-1).s;
    case"tb":return judge("dt",A.has?A.dtCD:null,-1,nd*(line?0.1:1)).s;

  }
}

const safeStorage={getItem:k=>{try{return localStorage.getItem(k)}catch(e){return null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},removeItem:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function sbAvailable(){return !!(window.supabase&&window.supabase.createClient&&CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY)}
// lock: bỏ khóa liên-tab của trình duyệt (navigator.locks) – nguyên nhân treo "Đang đăng nhập…" ở một số máy/khi mở file trực tiếp
const noLock=async(name,timeout,fn)=>await fn();
if(sbAvailable())SB=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:safeStorage,storageKey:"tlc-auth",lock:noLock}});
// Mỗi bước gọi máy chủ có giới hạn thời gian để không bao giờ treo im lặng
function withTimeout(p,ms,step){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("TIMEOUT:"+step)),ms))])}
function setStep(t){const m=$("#lMsg");if(m&&!$("#loginView").hidden){m.className="msg";m.textContent=t}}

// Tên đăng nhập dự kiến: tên + chữ đầu họ, đệm; không dấu (máy chủ kiểm tra trùng và thêm số)
function makeUsername(full){
  const p=String(full||"").replace(/[Đđ]/g,"d").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z ]/g,"").trim().split(/\s+/).filter(Boolean);
  if(p.length<2)return"";return p[p.length-1]+p.slice(0,-1).map(x=>x[0]).join("");
}
function sbErr(e){
  const m=String(e&&(e.message||e.error_description||e)||"");
  if(/Invalid login credentials/i.test(m))return"Sai tên đăng nhập hoặc mật khẩu.";
  if(/banned/i.test(m))return"Tài khoản đã bị khóa. Liên hệ GĐNM.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return"Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.";
  if(/current.?password|reauthentication/i.test(m))return"Mật khẩu hiện tại không đúng.";
  if(/same.*password|should be different/i.test(m))return"Mật khẩu mới phải khác mật khẩu cũ.";
  if(/row-level security|permission denied/i.test(m))return"Không có quyền thực hiện thao tác này.";
  if(/^TIMEOUT:/.test(m))return"Máy chủ không phản hồi ở bước: "+m.slice(8)+". Kiểm tra mạng, hoặc mở Supabase xem project có đang tạm dừng (Paused) không.";
  if(/Could not find the function|PGRST202|does not exist/i.test(m))return"Máy chủ chưa có cấu trúc dữ liệu (chưa chạy file SQL Giai đoạn 3). Chi tiết: "+m;
  return m||"Có lỗi, thử lại.";
}

function demoAbsent(p,d){d=d||todayISO();if(p.status==="on")return false;if(p.status_from&&d<p.status_from)return false;if(p.status==="leave"&&p.status_to&&d>p.status_to)return false;return true}
function demoApprover(deptId,d){const h=DEMO_DB.positions.find(p=>p.dept_id===deptId&&p.kind==="head");if(!h)return null;
  if(!demoAbsent(h,d)){const u=DEMO_DB.profiles.find(x=>x.position_id===h.id&&x.status==="active");if(u)return u.id}
  if(h.acting_profile_id&&DEMO_DB.profiles.some(x=>x.id===h.acting_profile_id&&x.status==="active"))return h.acting_profile_id;return null}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const api={
  async me(){if(RUN==="DEMO"){const p=DEMO_DB.profiles.find(x=>x.id===DEMO_DB.uid);const d=DEMO_DB.depts.find(x=>x.id===p.dept_id),ps=DEMO_DB.positions.find(x=>x.id===p.position_id);
      return{...p,dept_name:d.name,dept_code:d.code,position_name:ps.name,position_kind:ps.kind,report_code:ps.report_code,approves_depts:DEMO_DB.depts.filter(x=>demoApprover(x.id)===p.id).map(x=>x.id),today:todayISO()}}

    if(a.error)throw a.error;if(b.error)throw b.error;return{depts:a.data,positions:b.data}},
  async profiles(){if(RUN==="DEMO")return DEMO_DB.profiles.slice();
    const{data,error}=await SB.from("profiles").select("id,username,full_name,dept_id,position_id,manager_id,role,status,must_change_pw,created_at").order("dept_id").order("full_name");if(error)throw error;return data},
  async approvers(){if(RUN==="DEMO")return DEMO_DB.depts.filter(d=>DEMO_DB.positions.some(p=>p.dept_id===d.id&&p.kind==="head")).map(d=>{const h=DEMO_DB.positions.find(p=>p.dept_id===d.id&&p.kind==="head");const nm=id=>(DEMO_DB.profiles.find(x=>x.id===id)||{}).full_name||null;const holder=DEMO_DB.profiles.find(x=>x.position_id===h.id&&x.status==="active");const ap=demoApprover(d.id);
      return{dept_id:d.id,dept_name:d.name,head_position_id:h.id,head_name:holder?holder.full_name:null,status:h.status,status_from:h.status_from,status_to:h.status_to,acting_profile_id:h.acting_profile_id,acting_name:nm(h.acting_profile_id),absent_today:demoAbsent(h),approver_id:ap,approver_name:nm(ap)}});
    const{data,error}=await SB.rpc("dept_approvers");if(error)throw error;return data},
  async setPosition(id,status,from,to,acting,note){
    if(RUN==="DEMO"){if(status!=="on"&&!from)throw new Error("Cần nhập Từ ngày");if(status==="leave"&&(!to||to<from))throw new Error("Nghỉ tạm thời cần Đến ngày ≥ Từ ngày");
      const p=DEMO_DB.positions.find(x=>x.id===id);Object.assign(p,{status,status_from:status==="on"?null:from,status_to:status==="leave"?to:null,acting_profile_id:status==="on"?null:(acting||null)});
      DEMO_DB.history.unshift({position_id:id,status,status_from:p.status_from,status_to:p.status_to,acting_profile_id:p.acting_profile_id,note,changed_by:ME.id,changed_at:new Date().toISOString()});return}

  async changePassword(cur,nw){if(RUN==="DEMO")return;

function demoAdmin(action,p){
  const pw=()=>Math.random().toString(36).slice(2,8)+"A7"+Math.floor(Math.random()*90+10);
  if(action==="create"){const base=makeUsername(p.full_name);if(!base)throw new Error("Nhập đủ họ và tên (ít nhất 2 từ)");let u=base,n=1;while(DEMO_DB.profiles.some(x=>x.username===u)){n++;u=base+n}
    const ps=DEMO_DB.positions.find(x=>x.id===+p.position_id);if(!ps)throw new Error("Vị trí không tồn tại");if(p.role==="head"&&ps.kind!=="head")throw new Error("Vai trò Trưởng bộ phận phải gắn với vị trí Trưởng bộ phận");
    DEMO_DB.profiles.push({id:"d-"+u,username:u,full_name:p.full_name.trim(),dept_id:ps.dept_id,position_id:ps.id,manager_id:p.manager_id||null,role:p.role,status:"active",must_change_pw:true,created_at:todayISO()});return{ok:true,username:u,password:pw()}}
  const x=DEMO_DB.profiles.find(q=>q.id===p.id);if(!x)throw new Error("Không tìm thấy tài khoản");
  if(action==="reset_password"){x.must_change_pw=true;return{ok:true,password:pw()}}
  if(action==="set_status"){if(x.id===ME.id)throw new Error("Không tự khóa tài khoản của mình");x.status=p.status;return{ok:true}}
  if(action==="update"){if(p.position_id){const ps=DEMO_DB.positions.find(q=>q.id===+p.position_id);x.position_id=ps.id;x.dept_id=ps.dept_id}if(p.role)x.role=p.role;if("manager_id"in p)x.manager_id=p.manager_id||null;return{ok:true}}
}

function showView(v){["loginView","pwView","appView"].forEach(id=>{$("#"+id).hidden=id!==v})}
function showLogin(msg){
  showView("loginView");
  $("#srvState").innerHTML=SB?`Máy chủ: <b>${esc(CONFIG.SUPABASE_URL.replace(/^https:\/\//,""))}</b>`:`<span style="color:var(--bad)">Chưa tải được thư viện kết nối hoặc chưa cấu hình máy chủ. Chỉ dùng được bản DEMO.</span>`;
  $("#lUser").disabled=$("#lPass").disabled=$("#lBtn").disabled=!SB;
  const m=$("#lMsg");m.className="msg "+(msg?"bad":"");m.textContent=msg||"";
}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const m=$("#lMsg");const u=$("#lUser").value.trim().toLowerCase(),pw=$("#lPass").value;
  $("#lUser").classList.toggle("err",!/^[a-z0-9]+$/.test(u));$("#lPass").classList.toggle("err",!pw);
  if(!/^[a-z0-9]+$/.test(u)){m.className="msg bad";m.textContent="Tên đăng nhập chỉ gồm chữ thường không dấu và số, ví dụ sangnt.";return}
  if(!pw){m.className="msg bad";m.textContent="Nhập mật khẩu.";return}
  setStep("Bước 1/4: Kiểm tra tên đăng nhập và mật khẩu…");$("#lBtn").disabled=true;
  try{const{error}=await withTimeout(SB.auth.signInWithPassword({email:u+"@"+EMAIL_DOMAIN,password:pw}),20000,"kiểm tra mật khẩu");if(error)throw error;LAST_PW=pw;RUN="LIVE";await afterLogin()}
  catch(err){m.className="msg bad";m.textContent=sbErr(err)}finally{$("#lBtn").disabled=!SB}
});
document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{RUN="DEMO";DEMO_DB=JSON.parse(JSON.stringify(DEMO_ORG));DEMO_DB.uid=DEMO_LOGIN[b.dataset.demo];afterLogin()});
async function afterLogin(){
  try{
    setStep("Bước 2/4: Tải hồ sơ người dùng…");
    ME=await withTimeout(api.me(),20000,"tải hồ sơ");
    if(!ME){await logout("Đăng nhập đúng nhưng tài khoản chưa được gắn hồ sơ. Với GĐNM: chạy lệnh tlc_bootstrap_admin ở Bước 2 hướng dẫn.");return}
    if(ME.status!=="active"){await logout("Tài khoản đã bị khóa. Liên hệ GĐNM.");return}
    setStep("Bước 3/4: Tải danh mục bộ phận, vị trí…");
    REF=await withTimeout(api.ref(),20000,"tải danh mục");
    setStep("Bước 4/4: Tải cấu hình…");
    const st=await withTimeout(api.settings(),20000,"tải cấu hình");
    if(st){const th=(st.rows.find(r=>r.key==="thresholds")||{}).value,ru=(st.rows.find(r=>r.key==="rules")||{}).value;
      if(th)CFG.th=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG.th)),th);
      if(ru){["cutoff","stdProd","ngDiffPct","ngDiffQty","dtDiffMin"].forEach(k=>{if(ru[k]!=null)CFG[k]=ru[k]});CFG.warrantyCycle=ru.warrantyCycle||"month"}
      if(st.lines.length)CFG.lines=st.lines.map(l=>l.name)}
    if(ME.must_change_pw){showPw(true);return}
    startApp();
  }catch(err){await logout(sbErr(err))}
}
function showPw(forced){
  showView("pwView");$("#pwTitle").textContent=forced?"Đổi mật khẩu lần đầu":"Đổi mật khẩu";
  $("#pwNote").textContent=forced?"Mật khẩu GĐNM cấp là mật khẩu tạm. Đặt mật khẩu riêng để tiếp tục.":"Mật khẩu mới có hiệu lực ngay cho lần đăng nhập sau.";
  $("#pCur").value=forced?LAST_PW:"";$("#pNew").value=$("#pNew2").value="";$("#pMsg").textContent="";$("#pCancel").hidden=forced;$("#pNew").focus();
}
$("#pwForm").addEventListener("submit",async e=>{
  e.preventDefault();const m=$("#pMsg"),cur=$("#pCur").value,n1=$("#pNew").value,n2=$("#pNew2").value;
  ["pCur","pNew","pNew2"].forEach(i=>$("#"+i).classList.remove("err"));
  const bad=(id,t)=>{$("#"+id).classList.add("err");m.className="msg bad";m.textContent=t};
  if(!cur)return bad("pCur","Nhập mật khẩu hiện tại.");
  if(n1.length<8||!/[A-Za-z]/.test(n1)||!/\d/.test(n1))return bad("pNew","Mật khẩu mới tối thiểu 8 ký tự, có cả chữ và số.");
  if(n1===cur)return bad("pNew","Mật khẩu mới phải khác mật khẩu hiện tại.");
  if(n1!==n2)return bad("pNew2","Nhập lại mật khẩu mới chưa khớp.");
  m.className="msg";m.textContent="Đang lưu…";
  try{await api.changePassword(cur,n1);ME.must_change_pw=false;LAST_PW="";toast("Đã đổi mật khẩu");startApp()}catch(err){m.className="msg bad";m.textContent=sbErr(err)}
});
$("#pCancel").onclick=()=>startApp();
async function logout(msg){try{if(RUN==="LIVE"&&SB)await withTimeout(SB.auth.signOut({scope:"local"}),4000,"đăng xuất")}catch(e){try{safeStorage.removeItem("tlc-auth")}catch(_){}}ME=null;RUN=null;DEMO_DB=null;showLogin(msg)}
if(SB)SB.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&RUN==="LIVE"){ME=null;RUN=null;showLogin("Phiên đăng nhập đã kết thúc. Đăng nhập lại.")}});

  }
  if(cfgTab==="kpi")return cfgHead()+`<div class="tbl"><table><tr><th>Chỉ số</th><th>Hướng</th><th>Mục tiêu</th><th>Xanh khi đạt ≥ (%)</th><th>Vàng khi đạt ≥ (%)</th></tr>
  ${Object.entries(THN).map(([k,v])=>`<tr><td>${v[0]} <span class="small">(${v[1]})</span></td><td>${v[2]>0?"Càng cao càng tốt":"Càng thấp càng tốt"}</td>
   <td><input id="t-${k}" value="${CFG.th[k].tgt}" inputmode="decimal" style="width:90px"></td><td><input id="g-${k}" value="${CFG.th[k].g}" inputmode="decimal" style="width:70px"></td><td><input id="y-${k}" value="${CFG.th[k].y}" inputmode="decimal" style="width:70px"></td></tr>`).join("")}</table></div>
  <p class="small">"% đạt" = thực tế ÷ mục tiêu (càng cao càng tốt) hoặc mục tiêu ÷ thực tế (càng thấp càng tốt). Ví dụ tỷ lệ lỗi mục tiêu 0,8%: Vàng ≥ 80% nghĩa là lỗi đến 1,00% còn Vàng.</p>${saveBar()}`;
  if(cfgTab==="line")return cfgHead()+`<div class="two" style="margin-top:0">
   <div class="card"><h3>Tên line sản xuất</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">${CFG.lines.map((l,i)=>`<div class="fld"><label for="ln${i}">Line số ${i+1}</label><input id="ln${i}" data-ln="${i}" value="${esc(l)}" maxlength="20"></div>`).join("")}</div></div>
   <div class="card"><h3>Quy tắc chung</h3><div style="display:grid;gap:8px">
    <div class="fld"><label for="cut">Giờ chốt báo cáo ngày (HH:MM)</label><input id="cut" value="${CFG.cutoff}"></div>
    <div class="fld"><label for="std">Định mức năng suất mặc định cho mã chưa có định mức (sp/người/giờ)</label><input id="std" value="${CFG.stdProd}" inputmode="decimal"></div>
    <div class="fld"><label for="ngp">Lệch NG QAC ↔ SX cảnh báo khi > (%) và > (sp)</label><div style="display:flex;gap:6px"><input id="ngp" value="${CFG.ngDiffPct}" inputmode="decimal"><input id="ngq" value="${CFG.ngDiffQty}" inputmode="numeric" aria-label="Lệch NG tối thiểu (sp)"></div></div>
    <div class="fld"><label for="dtm">Lệch giờ dừng CĐ ↔ SX cảnh báo khi > (phút)</label><input id="dtm" value="${CFG.dtDiffMin}" inputmode="numeric"></div>
    <div class="fld"><label for="wcy">KTGT cập nhật tỷ lệ lỗi bảo hành theo</label><select id="wcy">${[["day","Ngày"],["week","Tuần"],["month","Tháng"]].map(([k,n])=>`<option value="${k}" ${(CFG.warrantyCycle||"month")===k?"selected":""}>${n}</option>`).join("")}</select></div>
   </div></div></div>${saveBar()}`;
  return cfgHead()+`<div class="alert"><span class="sv"></span><div class="b"><div class="t">Chưa kết nối · làm ở Giai đoạn 5</div><div class="d">Khi chạy thật, màn hình này hiện thời điểm đồng bộ gần nhất, số dòng và lỗi của từng loại dữ liệu từ Bravo 8.</div></div></div>`;
}
function saveBar(){return `<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center"><button class="btn" id="cfgSave" type="button">Lưu cấu hình</button><button class="btn ghost" id="cfgReset" type="button">Khôi phục mặc định</button><span class="msg" id="cfgMsg" role="status"></span></div>`}
function bindConfig(){
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{cfgTab=b.dataset.ct;render()});
  document.querySelectorAll("[data-md]").forEach(el=>el.onchange=()=>{const k=el.dataset.md,m=el.value;$("#fr-"+k).disabled=m==="on";$("#to-"+k).disabled=m!=="leave";$("#ac-"+k).disabled=m==="on";if(m!=="on"&&!$("#fr-"+k).value)$("#fr-"+k).value=ME.today||todayISO()});
  document.querySelectorAll("[data-apply]").forEach(b=>b.onclick=async()=>{const k=+b.dataset.apply,m=$("#md-"+k).value,fr=$("#fr-"+k).value,to=$("#to-"+k).value,ac=$("#ac-"+k).value,msg=$("#hm-"+k);
    ["fr-","to-"].forEach(p=>$("#"+p+k).classList.remove("err"));
    if(m!=="on"&&!fr){$("#fr-"+k).classList.add("err");msg.className="msg bad";msg.textContent="Nhập Từ ngày";return}
    if(m==="leave"&&(!to||to<fr)){$("#to-"+k).classList.add("err");msg.className="msg bad";msg.textContent="Đến ngày phải ≥ Từ ngày";return}
    b.disabled=true;msg.className="msg";msg.textContent="Đang lưu…";
    try{await api.setPosition(k,m,fr,to,ac,null);ME=await api.me();REF=await api.ref();toast("Đã áp dụng");render()}catch(err){msg.className="msg bad";msg.textContent=sbErr(err);b.disabled=false}});
  const save=$("#cfgSave");if(!save)return;
  const num=el=>{const v=parseFloat(String(el.value).replace(",","."));return isFinite(v)&&v>=0?v:null};
  save.onclick=async()=>{const msg=$("#cfgMsg");let bad=0;document.querySelectorAll("#main input").forEach(e=>e.classList.remove("err"));
    const th=JSON.parse(JSON.stringify(CFG.th));
    if(cfgTab==="kpi")Object.keys(THN).forEach(k=>{["tgt","g","y"].forEach(f=>{const el=$(`#${f==="tgt"?"t":f}-${k}`);const v=num(el);if(v==null||(f==="tgt"&&v===0)){el.classList.add("err");bad++}th[k][f]=v});if(th[k].g!=null&&th[k].y!=null&&th[k].g<th[k].y){$("#g-"+k).classList.add("err");bad++}});
    const rules={cutoff:CFG.cutoff,stdProd:CFG.stdProd,ngDiffPct:CFG.ngDiffPct,ngDiffQty:CFG.ngDiffQty,dtDiffMin:CFG.dtDiffMin,warrantyCycle:CFG.warrantyCycle||"month",driveExport:"20:00"};let lines=CFG.lines.slice();
    if(cfgTab==="line"){const cut=$("#cut").value.trim();if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(cut)){$("#cut").classList.add("err");bad++}rules.cutoff=cut;
      [["std","stdProd",true],["ngp","ngDiffPct"],["ngq","ngDiffQty"],["dtm","dtDiffMin"]].forEach(([id,k,pos])=>{const v=num($("#"+id));if(v==null||(pos&&!v)){$("#"+id).classList.add("err");bad++}rules[k]=v});
      rules.warrantyCycle=$("#wcy").value;
      lines=[...document.querySelectorAll("[data-ln]")].map(e=>e.value.trim());lines.forEach((l,i)=>{if(!l){$("#ln"+i).classList.add("err");bad++}});
      if(new Set(lines).size!==lines.length){msg.className="msg bad";msg.textContent="Tên line bị trùng.";return}}
    if(bad){msg.className="msg bad";msg.textContent=`${bad} ô sai (ô đỏ): số ≥ 0, mục tiêu khác 0, Xanh ≥ Vàng, giờ dạng HH:MM, tên line không trống.`;return}
    save.disabled=true;msg.className="msg";msg.textContent="Đang lưu…";
    try{CFG.th=th;Object.assign(CFG,rules);CFG.lines=lines;await api.saveSettings(th,rules,lines);msg.className="msg ok";msg.textContent="Đã lưu. Tổng quan nhà máy dùng ngưỡng mới.";toast("Đã lưu cấu hình");updateBell()}
    catch(err){msg.className="msg bad";msg.textContent=sbErr(err)}finally{save.disabled=false}};
  $("#cfgReset").onclick=()=>{const d=JSON.parse(JSON.stringify(DEFAULT_CFG));if(cfgTab==="kpi")CFG.th=d.th;else{["cutoff","stdProd","ngDiffPct","ngDiffQty","dtDiffMin"].forEach(k=>CFG[k]=d[k]);CFG.lines=d.lines}render();toast("Đã điền giá trị mặc định, bấm Lưu để áp dụng")};
}

function bindAccounts(){
  const name=$("#aName"),pos=$("#aPos"),role=$("#aRole");
  name.oninput=()=>{const u=makeUsername(name.value);$("#aUser").textContent=u?"Tên đăng nhập dự kiến: "+u+" (trùng sẽ thêm số)":""};
  pos.onchange=()=>{const p=REF.positions.find(x=>x.id===+pos.value);if(p)role.value=p.kind==="head"?"head":p.kind==="director"?"admin":"staff"};
  $("#accForm").addEventListener("submit",async e=>{e.preventDefault();const m=$("#aMsg");[name,pos].forEach(x=>x.classList.remove("err"));
    if(name.value.trim().split(/\s+/).length<2){name.classList.add("err");m.className="msg bad";m.textContent="Nhập đủ họ và tên.";return}
    if(!pos.value){pos.classList.add("err");m.className="msg bad";m.textContent="Chọn vị trí.";return}
    const p=REF.positions.find(x=>x.id===+pos.value);if(role.value==="head"&&p.kind!=="head"){role.classList.add("err");m.className="msg bad";m.textContent="Vai trò Trưởng bộ phận phải chọn vị trí Trưởng bộ phận.";return}
    $("#aBtn").disabled=true;m.className="msg";m.textContent="Đang tạo…";
    try{const r=await api.admin("create",{full_name:name.value.trim(),position_id:+pos.value,role:role.value,manager_id:$("#aMgr").value||null});
      ACC_SECRET={title:"Đã tạo tài khoản "+name.value.trim(),username:r.username,password:r.password};toast("Đã tạo tài khoản");render()}
    catch(err){m.className="msg bad";m.textContent=sbErr(err);$("#aBtn").disabled=false}});
  const cp=$("#copyPw");if(cp)cp.onclick=()=>{const t=`Tên đăng nhập: ${ACC_SECRET.username}\nMật khẩu tạm: ${ACC_SECRET.password}`;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Đã sao chép")).catch(()=>{const r=document.createRange();r.selectNodeContents($("#tmpPw"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Đã chọn mật khẩu, nhấn Ctrl+C")})};
  $("#accQ").oninput=e=>{accQ=e.target.value;const pos=e.target.selectionStart;render().then(()=>{const n=$("#accQ");if(n){n.focus();n.setSelectionRange(pos,pos)}})};
  $("#accDept").onchange=e=>{accDept=e.target.value;render()};
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{const key=b.dataset.act+b.dataset.id;
    if(accConfirm!==key){accConfirm=key;render();return}accConfirm=null;b.disabled=true;
    const who=(await api.profiles()).find(p=>p.id===b.dataset.id)||{};
    try{if(b.dataset.act==="reset"){const r=await api.admin("reset_password",{id:b.dataset.id});ACC_SECRET={title:"Đã đặt lại mật khẩu cho "+who.full_name,username:who.username,password:r.password}}
      else{await api.admin("set_status",{id:b.dataset.id,status:b.dataset.act==="lock"?"locked":"active"});toast(b.dataset.act==="lock"?"Đã khóa tài khoản":"Đã mở khóa")}render()}
    catch(err){toast(sbErr(err));render()}});
}

   KHUNG ỨNG DỤNG: SIDEBAR THEO VAI TRÒ, THÔNG BÁO
   ============================================================ */
const MODS=[["dash","Tổng quan nhà máy",2],["mydept","Bộ phận của tôi",3],["task","Giao việc",4],["mine","Công việc của tôi",3],["daily","Báo cáo hằng ngày",4],["sx","Sản xuất",5],["qc","Chất lượng",5],["kho","Kho",5],["kh","Kế hoạch",5],["kt","Kỹ thuật",5],["bt","Bảo trì",5],["gt","Giá thành",5],["bh","Bảo hành",5],["ns","Nhân sự",5],["kpi","KPI",6],["5s","5S",5],["vd","Vấn đề và cải tiến",6],["lich","Lịch điều hành",6],["acc","Quản lý tài khoản",3],["cfg","Cấu hình hệ thống",3]];
const DEPT_MOD={SX:"sx",QAC:"qc",KHO:"kho",KHSX:"kh",KT:"kt",CD:"bt",KTGT:"gt",BHM:"bh",BHN:"bh",HCNS:"ns"};
function allowedMods(){
  if(!ME)return[];if(ME.role==="admin")return MODS.map(m=>m[0]).filter(k=>k!=="mydept");
  const a=[];const approver=ME.role==="head"||(ME.approves_depts||[]).length;
  if(approver)a.push("mydept","task");a.push("mine","daily");
  const dm=DEPT_MOD[ME.dept_code];if(dm)a.push(dm);
  (ME.approves_depts||[]).forEach(id=>{const c=(REF.depts.find(d=>d.id===id)||{}).code;const k=DEPT_MOD[c];if(k&&!a.includes(k))a.push(k)});
  a.push("kpi","5s","vd","lich");return a;
}
function homeMod(){return ME.role==="admin"?"dash":((ME.role==="head"||(ME.approves_depts||[]).length)?"mydept":"mine")}
function renderSide(){
  const allow=allowedMods();const list=MODS.filter(m=>allow.includes(m[0]));
  const grp=k=>["dash","mydept","task","mine","daily"].includes(k)?"Điều hành":["acc","cfg","kpi","lich","vd","5s"].includes(k)?(["acc","cfg"].includes(k)?"Quản trị":"Theo dõi"):"Bộ phận";
  let last="";$("#side").innerHTML=list.map(([k,n,g])=>{const gname=grp(k);const h=gname!==last?`<div class="grp">${gname}</div>`:"";last=gname;
    return h+`<button type="button" data-mod="${k}" aria-current="${ST.screen===k}"><span>${n}</span>${g>3?`<span class="ph">GĐ${g}</span>`:""}</button>`}).join("");
  $("#side").querySelectorAll("button").forEach(b=>b.onclick=()=>{ST.screen=b.dataset.mod;ACC_SECRET=null;accConfirm=null;render();window.scrollTo(0,0)});
}
function updateBell(){
  const el=$("#bellN");if(ME&&ME.role==="admin"){if(!A)compute();const n=ALERTS.length;el.hidden=!n;el.textContent=n;
    $("#notif").innerHTML=`<h4>Thông báo · ${esc(periodLabel())}</h4>`+(n?alertsHTML(ALERTS):`<div class="empty">Không có thông báo</div>`)}
  else{el.hidden=true;$("#notif").innerHTML=`<h4>Thông báo</h4><div class="empty">Thông báo việc mới, sắp đến hạn, quá hạn có ở Giai đoạn 4.</div>`}
}
let renderSeq=0;
async function render(){
  const seq=++renderSeq;renderSide();
  if(!allowedMods().includes(ST.screen))ST.screen=homeMod();
  const mod=MODS.find(x=>x[0]===ST.screen)||MODS[0];const main=$("#main");
  try{
    if(ST.screen==="dash"){main.innerHTML=viewDash();bindDash()}
    else if(ST.screen==="cfg"){const h=await viewConfig();if(seq!==renderSeq)return;main.innerHTML=h;bindConfig()}
    else if(ST.screen==="acc"){const h=await viewAccounts();if(seq!==renderSeq)return;main.innerHTML=h;bindAccounts()}
    else if(ST.screen==="mydept"){const h=await viewMyDept();if(seq!==renderSeq)return;main.innerHTML=h}
    else if(ST.screen==="mine"){main.innerHTML=viewMine();$("#chgPw").onclick=()=>showPw(false)}
    else main.innerHTML=`<h2 class="sec" style="margin-top:0">${mod[1]}</h2><div class="ph-card"><b>Xây ở Giai đoạn ${mod[2]}.</b><p class="small" style="margin:6px 0 0">Nội dung và phân quyền đã chốt ở Giai đoạn 1. Bạn thấy mục này vì vai trò của bạn được phép dùng nó.</p></div>`;
  }catch(err){main.innerHTML=`<div class="alert bad"><span class="sv"></span><div class="b"><div class="t">Không tải được dữ liệu</div><div class="d">${esc(sbErr(err))}</div></div></div>`}
  updateBell();
}
function startApp(){
  showView("appView");
  $("#user").innerHTML=`${esc(ME.full_name)}<small>${esc(ME.username)} · ${esc(ME.position_name)}</small>`;
  const c=$("#conn");c.classList.toggle("live",RUN==="LIVE");
  c.textContent=RUN==="LIVE"?"Đã kết nối máy chủ · số liệu SX mẫu đến GĐ5":"DEMO · dùng thử, không lưu máy chủ";
  ST.screen=homeMod();cfgTab="tbp";accQ="";accDept="";ACC_SECRET=null;accConfirm=null;render();
}
$("#logout").onclick=()=>logout();
$("#bell").onclick=e=>{e.stopPropagation();const p=$("#notif");p.hidden=!p.hidden;$("#bell").setAttribute("aria-expanded",String(!p.hidden))};
document.addEventListener("click",e=>{const p=$("#notif");if(!p.hidden&&!p.contains(e.target)&&e.target!==$("#bell")){p.hidden=true;$("#bell").setAttribute("aria-expanded","false")}});
function tick(){const d=new Date();$("#clock").textContent=["CN","T2","T3","T4","T5","T6","T7"][d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
tick();setInterval(tick,30000);
(async()=>{if(SB){try{const{data}=await SB.auth.getSession();if(data&&data.session){RUN="LIVE";await afterLogin();return}}catch(e){}}showLogin()})();

</script>

</html>
